<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dummy USN Barcode Labels</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 0 auto 18px;
        max-width: 760px;
      }
      h1 { margin: 0; font-size: 20px; }
      header p { margin: 0; color: #555; font-size: 12px; }
      .labels {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: auto;
        max-width: 760px;
      }
      .label {
        min-height: 1.55in;
        border: 1px dashed #999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      .label svg { display: block; width: 100%; height: 0.72in; }
      .usn {
        margin-top: 6px;
        font-family: "Courier New", monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .note { margin-top: 5px; color: #555; font-size: 9px; }
      .actions { text-align: center; margin: 0 0 18px; }
      button { padding: 8px 14px; font-size: 14px; }
      @page { size: letter; margin: 0.45in; }
      @media print {
        body { padding: 0; }
        .actions { display: none; }
        header { margin-bottom: 14px; }
        .labels { gap: 0.12in; }
        .label { min-height: 1.55in; break-inside: avoid; }
      }
      @media (max-width: 520px) {
        body { padding: 12px; }
        .labels { grid-template-columns: 1fr; }
        header { gap: 8px; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="actions"><button onclick="window.print()">Print labels</button></div>
    <header>
      <h1>Dummy USN Labels</h1>
      <p>Test data only · Code 128 · Print at 100% scale</p>
    </header>
    <main class="labels" id="labels" aria-label="Ten dummy USN barcode labels"></main>
    <script>
      // Standard Code 128 symbol patterns, indexed by symbol value.
      const patterns = [
        "212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
        "221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
        "221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
        "212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
        "231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
        "231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
        "314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
        "112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
        "111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
        "214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
        "114131","311141","411131","211412","211214","211232","2331112"
      ];
      const usns = Array.from({ length: 10 }, (_, i) => `USN000${String(123 + i).padStart(3, "0")}`);

      function code128B(text) {
        const values = [104, ...Array.from(text, char => char.charCodeAt(0) - 32)];
        const checksum = values.reduce((sum, value, index) => sum + value * (index || 1), 0) % 103;
        return [...values, checksum, 106];
      }

      function barcodeSvg(text) {
        const symbols = code128B(text);
        const modules = symbols.reduce((sum, value) =>
          sum + patterns[value].split("").reduce((width, run) => width + Number(run), 0), 0);
        let x = 10;
        const rects = [];
        for (const value of symbols) {
          const runs = patterns[value];
          for (let i = 0; i < runs.length; i++) {
            const width = Number(runs[i]);
            if (i % 2 === 0) rects.push(`<rect x="${x}" y="0" width="${width}" height="54"/>`);
            x += width;
          }
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${modules + 20} 54" role="img" aria-label="Code 128 barcode for ${text}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><g fill="black">${rects.join("")}</g></svg>`;
      }

      document.getElementById("labels").innerHTML = usns.map(usn =>
        `<article class="label">${barcodeSvg(usn)}<div class="usn">${usn}</div><div class="note">DUMMY TEST LABEL</div></article>`
      ).join("");
    </script>
  </body>
</html>
